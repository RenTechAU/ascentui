<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="description" content="Business-ready React components for CRM, services, finance and AI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <script>
      // Apply a saved light site theme before the first paint. Dark is the default.
      try { if (localStorage.getItem('asc-site-theme') === 'light') { document.documentElement.classList.remove('dark'); document.documentElement.dataset.site = 'light'; } } catch (e) {}
    </script>
    <title>AscentUI: UI for businesses</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
